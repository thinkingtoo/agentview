<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agentview</title>
<style>
  :root {
    --bg:#0e1013; --card:#171a1f; --line:#262b33; --ink:#e7eaee; --dim:#9aa3ae;
    --faint:#6b7480; --busy:#3ddc84; --wait:#f5c451; --idle:#5c6570; --accent:#7aa2f7;
    --claude:#d97757; --bad:#e5534b; --limit:#b794f6;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f6f7f9; --card:#fff; --line:#e2e5ea; --ink:#14171c; --dim:#5b6472;
            --faint:#8a929e; --busy:#1a9e5c; --wait:#b8860b; --idle:#a2aab5; --accent:#3b5bdb;
            --claude:#c2410c; --bad:#c0392b; --limit:#7a4fc7; }
  }
  html { zoom: {{ZOOM}}; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:14px/1.5 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif; }
  header { position:sticky; top:0; z-index:5; display:flex; align-items:baseline; flex-wrap:wrap; gap:14px;
           padding:14px 20px; background:var(--bg); border-bottom:1px solid var(--line); }
  h1 { margin:0; font-size:15px; letter-spacing:.11em; text-transform:uppercase;
       display:flex; align-items:center; gap:8px; }
  .logo { flex:none; }
  .count { color:var(--dim); font-size:13px; }
  .spacer { flex:1; }
  .q { font:inherit; font-size:13px; color:var(--ink); background:var(--card);
       border:1px solid var(--line); border-radius:7px; padding:5px 11px; width:190px; }
  .q:focus { outline:none; border-color:var(--accent); width:260px; }
  .q::placeholder { color:var(--faint); }
  .hidden-note { color:var(--faint); font-size:12px; }
  .stamp { color:var(--faint); font-size:12px; font-variant-numeric:tabular-nums; }
  button { font:inherit; font-size:13px; color:var(--ink); background:var(--card);
           border:1px solid var(--line); border-radius:7px; padding:5px 12px; cursor:pointer; }
  button:hover { border-color:var(--accent); color:var(--accent); }
  /* The chime belongs to the amber state it announces, so it is lit amber
     while it is armed. Blocked is the browser refusing to make any sound
     until you have touched the page -- one click on the button clears it. */
  button.armed { color:var(--wait); border-color:color-mix(in srgb,var(--wait) 55%,transparent);
                 background:color-mix(in srgb,var(--wait) 10%,transparent); }
  button.blocked { color:var(--bad); border-color:color-mix(in srgb,var(--bad) 55%,transparent);
                   background:color-mix(in srgb,var(--bad) 10%,transparent); }
  main { padding:18px 20px 40px; display:flex; gap:14px; align-items:flex-start; }
  .edit { cursor:text; border-bottom:1px dashed transparent; }
  .edit:hover { border-bottom-color:var(--faint); }
  /* A nudge, not a beat: the colour is the alarm, the movement only says
     the page is live. Anything stronger you learn to stop seeing. */
  @keyframes nudge { 0%,100% { transform:scale(1); opacity:1; }
                     50% { transform:scale(1.12); opacity:.8; } }
  .flag { font-size:10.5px; letter-spacing:.05em; text-transform:uppercase;
          border-radius:5px; padding:1px 6px; }
  .flag.waiting { color:var(--wait); border:1px solid color-mix(in srgb,var(--wait) 45%,transparent); }
  .flag.stuck { color:var(--bad); border:1px solid color-mix(in srgb,var(--bad) 45%,transparent); }
  /* A long tool call is news, not an alarm: no tint, no beat. */
  .flag.tool { color:var(--faint); border:1px solid var(--line); }
  .flag.ready { color:var(--accent); border:1px solid color-mix(in srgb,var(--accent) 45%,transparent); }
  .flag.unread { color:var(--dim); border:1px solid var(--line); }
  /* What it is blocked on, in Claude Code's own words. */
  .wf { color:var(--wait); font-size:11.5px; }
  .said { margin-top:3px; color:var(--dim); font-size:13px;
          display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .alarm { color:var(--bad); font-weight:650; }
  .assign { margin-top:7px; display:flex; gap:9px; align-items:center; font-size:11.5px; }
  .guess, .clear { cursor:pointer; color:var(--faint); }
  .guess { color:var(--claude); border:1px solid color-mix(in srgb,var(--claude) 40%,transparent);
           border-radius:999px; padding:1px 9px; overflow-wrap:anywhere; }
  .guess:hover { background:color-mix(in srgb,var(--claude) 16%,transparent); }
  .clear:hover { color:var(--accent); }
  input.inline { font:inherit; color:var(--ink); background:var(--bg);
                 border:1px solid var(--claude); border-radius:6px; padding:2px 7px;
                 min-width:220px; }
  .who { color:var(--dim); font-size:12px; margin-left:auto; }
  .go { opacity:0; transition:opacity .12s; color:var(--accent); font-size:12px; }
  @keyframes flash { from { background:color-mix(in srgb,var(--busy) 26%,transparent); } }
  @keyframes flash-bad { from { background:color-mix(in srgb,#e5534b 26%,transparent); } }
  .rhead { display:flex; align-items:center; gap:8px; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--idle); flex:none; }
  /* Slow: a session at work should look alive from across the room, not
     urgent. Motion on this page means working, and only working. */
  .dot.busy { background:var(--busy); animation:breathe 3.6s ease-in-out infinite;
              box-shadow:0 0 0 3px color-mix(in srgb,var(--busy) 22%,transparent); }
  @keyframes breathe { 0%,100% { transform:scale(1); opacity:1; }
                       50% { transform:scale(1.18); opacity:.65; } }
  .dot.waiting { background:var(--wait); }
  /* Finished, and you have not read it: a tick, not a light. */
  .tick { color:var(--accent); font-size:12px; line-height:1; flex:none; font-weight:700; }
  .nm { font-weight:600; }
  .bg-tag { font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--faint);
            border:1px solid var(--line); border-radius:5px; padding:1px 5px; }
  .bg-tag.extra { text-transform:none; letter-spacing:0; white-space:nowrap; }   /* a model name is not a label */
  .bg-tag.boss { color:var(--claude); border-color:color-mix(in srgb,var(--claude) 45%,transparent); }
  /* What it wants from you. The one line on the card that is an instruction
     rather than a report, so it is the one line that carries weight. */
  .need { margin-top:3px; color:var(--accent); font-weight:600; font-size:13px;
          display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .empty { color:var(--dim); padding:30px 20px; }
  /* The overview: one column per project, side by side. Each column is as
     tall as its own sessions and no taller (`main` aligns to flex-start), and
     when there are more projects than fit the row scrolls, not the page. */
  main.ov { overflow-x:auto; gap:12px; }
  /* min-width:0: what a tile says never widens its column (a line that does not wrap would). */
  .ov-col { flex:1 0 230px; min-width:0; max-width:330px; display:flex; flex-direction:column; gap:8px; }
  .ov-head { background:var(--card); border:1px solid var(--line); border-top:3px solid var(--line);
             border-radius:10px; padding:10px 12px; font-weight:650; font-size:15px; overflow-wrap:anywhere; }
  /* The card's own text: the name and its status word, what the project is about, how far a
     track has come. Nothing here is markup: it is all printed through esc(). */
  .ov-name[data-raw]:hover::after { content:attr(data-raw); margin-left:7px; font-size:11px;
                                    font-weight:400; color:var(--faint); }
  .ov-tag { font-size:10.5px; font-weight:650; letter-spacing:.06em; padding:0 6px; border-radius:8px;
            color:var(--dim); border:1px solid var(--line); }
  .ov-tag.met { color:var(--busy); border-color:color-mix(in srgb,var(--busy) 45%,transparent); }
  .ov-tag.paused { color:var(--wait); border-color:color-mix(in srgb,var(--wait) 45%,transparent); }
  .ov-ctx { margin-top:5px; font-weight:400; font-size:13px; line-height:1.4; color:var(--dim); cursor:text;
            overflow-wrap:anywhere; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .ov-ctx.maybe { color:var(--faint); font-style:italic; }
  .ov-ctx .add { font-style:normal; font-size:12px; color:var(--faint); }
  .ov-ctx:hover .add { color:var(--accent); }
  .ov-prog { display:flex; align-items:center; gap:7px; margin-top:6px; font-weight:400; font-size:12px; color:var(--dim); }
  .ov-bar { flex:1 1 0; max-width:90px; height:5px; border-radius:3px; background:var(--line); overflow:hidden; }
  .ov-bar i { display:block; height:100%; background:var(--busy); }
  .ov-notes { margin-left:auto; color:var(--faint); text-decoration:none; }
  .ov-notes:hover, .ov-notes.on { color:var(--accent); }
  .ov-hits { margin-top:6px; font-weight:400; font-size:12px; color:var(--dim); display:flex; flex-direction:column; gap:5px; }
  .ov-hits .hit-title { color:var(--ink); font-weight:600; overflow-wrap:anywhere; }
  .ov-hits .hit-snip { overflow-wrap:anywhere; }
  /* By hand: the name edits in place, the tools sit beside it and say nothing
     until they are needed. A pinned card is lit. */
  .ov-top { display:flex; align-items:baseline; gap:6px; }
  .ov-top .ov-name { flex:1 1 auto; min-width:0; }
  .ov-top input.inline { min-width:0; width:100%; font-weight:400; }
  .ov-tools { display:flex; align-items:center; gap:2px; flex:none; font-weight:400; }
  .ov-tools button, .ov-form button, .ov-merged button { padding:0 6px; font-size:12px; line-height:20px;
                                      border-color:transparent; background:none; color:var(--faint); }
  .ov-tools button:hover, .ov-form button:hover, .ov-merged button:hover { color:var(--accent); border-color:transparent; }
  .ov-merged { margin-top:6px; display:flex; flex-wrap:wrap; gap:0 10px; font-weight:400; font-size:12px;
               color:var(--dim); overflow-wrap:anywhere; }
  .ov-tools .ov-pin { font-size:13px; }
  .ov-tools .ov-pin.on { color:var(--claude); }
  .ov-tools .ov-merge { opacity:0; }
  .ov-head:hover .ov-merge, .ov-head:focus-within .ov-merge { opacity:1; }
  .ov-form { margin-top:6px; display:flex; flex-wrap:wrap; align-items:center; gap:4px 6px;
             font-weight:400; font-size:12px; color:var(--dim); }
  select.pick { font:inherit; font-size:12px; color:var(--ink); background:var(--bg); max-width:100%;
                border:1px solid var(--claude); border-radius:6px; padding:2px 5px; }
  /* Nothing moves when the pointer arrives: the control is there, only unlit,
     so a click meant to open the session never lands on something that
     appeared under it. */
  .tile button.move { margin-left:auto; padding:0 5px; font-size:13px; line-height:18px; border-color:transparent;
                      background:none; color:var(--faint); opacity:0; }
  .tile button.move + .go { margin-left:0; }
  .tile:hover button.move, .tile:focus-within button.move { opacity:1; }
  .tile button.move:hover { color:var(--accent); }
  .tile .ov-form { margin-top:4px; }
  .tile { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:9px 11px;
          display:flex; flex-direction:column; gap:3px; }
  .tile.can { cursor:pointer; }
  .tile.can:hover { border-color:var(--accent); }
  .tile.can:hover .go { opacity:1; }
  .tile .rhead { flex-wrap:wrap; gap:6px 8px; }
  .tile .nm { overflow-wrap:anywhere; }
  .tile .go { margin-left:auto; }
  .tile .go.none { opacity:1; color:var(--faint); }
  .tile .why { color:var(--bad); font-size:12px; overflow-wrap:anywhere; }
  .tile .why.note { color:var(--dim); }
  /* The working-on line is one line; the hover has all of it. A stand-in (the
     last prompt, the branch or the folder) is said more quietly. */
  .tile .tline { color:var(--dim); font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tile .tline.stand-in { color:var(--faint); }
  .tile.waiting { border-color:var(--wait); }
  .tile.stuck { border-color:var(--bad); }
  .tile.ready { border-color:color-mix(in srgb,var(--accent) 55%,var(--line)); }
  .tile.waiting .dot { animation:nudge 2.2s ease-in-out infinite; background:var(--wait); }
  .tile.stuck .dot { animation:nudge 1.8s ease-in-out infinite; background:var(--bad); }
  /* Movement. The strip is the project's only graph: one bar per minute for
     the last 30, oldest first. A minute the server could not see is a dotted
     stub, never an empty bar, because empty would say "wrote nothing". */
  .ov-mv { margin-top:8px; font-weight:400; font-size:12px; color:var(--dim); }
  .strip { display:flex; align-items:flex-end; gap:1px; height:28px; }
  .strip i { flex:1 1 0; min-width:2px; background:var(--busy); border-radius:1px 1px 0 0; }
  .strip i.z { height:1px; opacity:.35; }
  .strip i.u { height:1px; background:none; border-top:1px dotted var(--faint); }
  .mix { margin-top:5px; font-variant-numeric:tabular-nums; }
  .tile .mv { color:var(--dim); font-size:12px; overflow-wrap:anywhere; }
  /* The card's state is its second line: the name first, then one coloured
     word. The card is coloured by it -- top edge, a light tint, the word and
     the strip's bars -- so the page can be scanned by colour. */
  .ov-name, .ov-state { display:block; }
  .ov-state { margin-top:1px; font-size:10.5px; font-weight:700; letter-spacing:.09em; color:var(--faint); }
  .ov-head.st-needs { border-top-color:var(--wait); background:color-mix(in srgb,var(--wait) 9%,var(--card)); }
  .ov-head.st-needs .ov-state { color:var(--wait); }
  .ov-head.st-needs .strip i:not(.u) { background:var(--wait); }
  /* Error and Hung are red, Limit is purple: a wait for a reset is not a fault. */
  .ov-head.st-error, .ov-head.st-hung { border-top-color:var(--bad); background:color-mix(in srgb,var(--bad) 8%,var(--card)); }
  .ov-head.st-error .ov-state, .ov-head.st-hung .ov-state { color:var(--bad); }
  .ov-head.st-error .strip i:not(.u), .ov-head.st-hung .strip i:not(.u) { background:var(--bad); }
  .ov-head.st-limit { border-top-color:var(--limit); background:color-mix(in srgb,var(--limit) 8%,var(--card)); }
  .ov-head.st-limit .ov-state { color:var(--limit); }
  .ov-head.st-limit .strip i:not(.u) { background:var(--limit); }
  .ov-head.st-moving { border-top-color:var(--busy); background:color-mix(in srgb,var(--busy) 7%,var(--card)); }
  .ov-head.st-moving .ov-state { color:var(--busy); }
  .ov-head.st-idle { border-top-color:var(--idle); background:color-mix(in srgb,var(--idle) 7%,var(--card)); }
  .ov-head.st-idle .ov-state { color:var(--idle); }
  .ov-head.st-idle .strip i:not(.u) { background:var(--idle); }
  /* Needs you. The reason, then what the person needs to decide before they
     jump: the question with its options, the tool and its command, or what
     the session left. All of it is text a session wrote. */
  .tile.needs { border-color:var(--wait); }
  .flag.needs { color:var(--wait); border:1px solid color-mix(in srgb,var(--wait) 45%,transparent); }
  /* Error, Hung and Limit: the kind is the tag, the border and the dot. */
  .tile.error, .tile.hung { border-color:var(--bad); }
  .tile.limit { border-color:var(--limit); }
  .tile.error .dot, .tile.hung .dot { animation:nudge 1.8s ease-in-out infinite; background:var(--bad); }
  .tile.limit .dot { animation:none; background:var(--limit); }
  .flag.error, .flag.hung { color:var(--bad); border:1px solid color-mix(in srgb,var(--bad) 45%,transparent); }
  .flag.limit { color:var(--limit); border:1px solid color-mix(in srgb,var(--limit) 45%,transparent); }
  .stuck-box.error .reason, .stuck-box.hung .reason { color:var(--bad); }
  .stuck-box.limit .reason { color:var(--limit); }
  .stuck-box { margin-top:3px; display:flex; flex-direction:column; gap:4px; font-size:13px; }
  .stuck-box .reason { color:var(--wait); font-weight:600; font-size:12px; overflow-wrap:anywhere; }
  .stuck-box .late { color:var(--dim); font-size:12px; }
  .stuck-box .qh { color:var(--faint); font-size:11px; text-transform:uppercase; letter-spacing:.05em; margin-right:6px; }
  .stuck-box .qtext { overflow-wrap:anywhere; white-space:pre-wrap;
                      display:-webkit-box; -webkit-line-clamp:5; -webkit-box-orient:vertical; overflow:hidden; }
  .stuck-box ul { margin:2px 0 0; padding-left:16px; color:var(--dim); }
  .stuck-box li { overflow-wrap:anywhere; }
  .stuck-box .ol { color:var(--ink); }
  .stuck-box .od { color:var(--dim); }
  .stuck-box .say { overflow-wrap:anywhere; }
  .stuck-box .cmd { display:flex; flex-wrap:wrap; align-items:flex-start; gap:4px 8px; }
  .stuck-box .tool { color:var(--faint); font-size:11px; text-transform:uppercase; letter-spacing:.05em; padding-top:2px; }
  .stuck-box code { flex:1 1 100%; font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace; white-space:pre-wrap;
                    overflow-wrap:anywhere; max-height:5.6em; overflow:hidden; background:var(--bg);
                    border:1px solid var(--line); border-radius:6px; padding:3px 6px; }
  .stuck-box button.copy { margin-left:auto; font-size:12px; padding:2px 9px; }
  .tile.jumped { animation:flash .7s ease-out; }
  .tile.failed { animation:flash-bad 1.4s ease-out; }
  /* The header's counts: each is a button that lights up its sessions. */
  .hc { padding:1px 9px; font-size:12.5px; font-weight:650; font-variant-numeric:tabular-nums; }
  .hc.needs { color:var(--wait); }
  .hc.otherStuck { color:var(--bad); }
  .hc.moving { color:var(--busy); }
  .hc[aria-pressed="true"] { border-color:currentColor; background:color-mix(in srgb,currentColor 14%,transparent); }
  .hc:disabled { color:var(--faint); cursor:default; border-color:var(--line); }
  .hc:disabled:hover { color:var(--faint); border-color:var(--line); }
  /* Lit: the sessions in the count that was clicked. The rest fade, and a
     column with none is only its card. Columns keep their width. */
  .tile.dim { opacity:.3; }
  .tile.lit { box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 55%,transparent); }
  .ov-col.shrunk .tile, .ov-col.shrunk .pills { display:none; }
  /* Finished sessions: one line each at the foot of their column, name and how
     long idle; the working-on line is the hover. Quiet on purpose, never hidden. */
  .pills { display:flex; flex-direction:column; gap:4px; }
  .pill { display:flex; flex-wrap:wrap; align-items:center; gap:2px 8px; padding:3px 10px;
          font-size:12.5px; color:var(--dim); border:1px solid var(--line); border-radius:999px; }
  .pill.can { cursor:pointer; }
  .pill.can:hover { border-color:var(--accent); color:var(--ink); }
  .pill.can:hover .go { opacity:1; }
  .pill .nm { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pill .for { margin-left:auto; color:var(--faint); white-space:nowrap; font-variant-numeric:tabular-nums; }
  .pill .go.none { opacity:1; color:var(--faint); }
  .pill .why { flex:1 0 100%; color:var(--bad); font-size:12px; overflow-wrap:anywhere; }
  .pill .why.note { color:var(--dim); }
  .pill.jumped { animation:flash .7s ease-out; }
  .pill.failed { animation:flash-bad 1.4s ease-out; }
  .pill.dim { opacity:.3; }
  /* Pin: nothing moves when the pointer arrives, the control is only unlit. */
  button.keep { padding:0 6px; font-size:12px; line-height:18px; border-color:transparent; background:none;
                color:var(--faint); opacity:0; }
  .tile:hover button.keep, .tile:focus-within button.keep, .pill:hover button.keep,
  .pill:focus-within button.keep, button.keep.on { opacity:1; }
  button.keep:hover { color:var(--accent); }
  .tile .said { margin-top:0; overflow-wrap:anywhere; }
  /* A condition of the whole machine, across the top under the header's row.
     The negative margin cancels the header's own 14px 20px padding, so the band
     runs edge to edge and sits flush with the header's bottom. */
  #banners { flex:1 0 100%; margin:0 -20px -14px; }
  #banners:empty { display:none; }
  .banner { padding:6px 20px; font-size:13px; font-weight:600; overflow-wrap:anywhere;
            color:var(--bad); background:color-mix(in srgb,var(--bad) 12%,var(--bg));
            border-top:1px solid color-mix(in srgb,var(--bad) 40%,transparent); }
#restore[hidden], #closed[hidden], #closedlist[hidden] { display: none; }
#save.unsafe { color: var(--wait); }
/* Conversations this boot had that no longer run. A drop-down under the
   header, so opening it never moves the cards you were reading. */
#closedlist { position:fixed; right:20px; z-index:6; width:min(560px, calc(100vw - 32px));
              max-height:70vh; overflow:auto; background:var(--card); border:1px solid var(--line);
              border-radius:11px; box-shadow:0 8px 28px rgba(0,0,0,.35); padding:6px; }
#closedlist .none { color:var(--dim); padding:10px 12px; font-size:13px; }
.gone { display:flex; align-items:flex-start; gap:6px; border-radius:8px; }
.gone:hover { background:color-mix(in srgb,var(--accent) 8%,transparent); }
.gone .back { flex:1; min-width:0; text-align:left; background:none; border:0; padding:7px 10px; }
.gone .back:hover { color:var(--ink); }
.gone .who { display:flex; gap:8px; align-items:baseline; }
.gone .nm { font-weight:600; }
.gone .at { margin-left:auto; color:var(--faint); font-size:12px; font-variant-numeric:tabular-nums; }
.gone .tt { color:var(--dim); font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.gone .wd { color:var(--faint); font-size:11.5px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
            white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.gone .x { background:none; border:0; color:var(--faint); padding:7px 10px; }
.gone .x:hover { color:var(--bad); }
.gone .err { color:var(--bad); font-size:12px; }
/* Every conversation this machine has had, found by what was said in it.
   The same drop-down as the closed list. A click on a row opens the
   conversation, or jumps to it if it runs. */
#find:focus { width:300px; }
#found[hidden] { display:none; }
#found { position:fixed; right:20px; z-index:6; width:min(660px, calc(100vw - 32px));
         max-height:75vh; overflow:auto; background:var(--card); border:1px solid var(--line);
         border-radius:11px; box-shadow:0 8px 28px rgba(0,0,0,.35); padding:6px; }
#found .none { color:var(--dim); padding:10px 12px; font-size:13px; }
#found .foot { color:var(--faint); font-size:11.5px; padding:6px 12px 2px; }
#found .off { color:var(--dim); font-size:12px; padding:6px 12px; border-bottom:1px solid var(--line); }
.hit { padding:8px 10px; cursor:pointer; border-radius:8px; }
.hit:hover, .hit:focus-visible { background:color-mix(in srgb,var(--accent) 8%,transparent); outline:0; }
.hit + .hit { border-top:1px solid var(--line); }
.hit .err { color:var(--bad); font-size:12px; }
.hit .who { display:flex; gap:8px; align-items:baseline; }
.hit .nm { font-weight:600; }
.hit .pj { color:var(--dim); font-size:12px; }
.hit .at { margin-left:auto; color:var(--faint); font-size:12px; font-variant-numeric:tabular-nums;
           white-space:nowrap; }
.hit .tt { font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
/* The two lines that say which conversation this is: what it was about, and
   where it stood when it stopped. One line each; the whole text is in the tooltip. */
.hit .sum { margin:1px 0 3px; }
.hit .sum div { font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.hit .sum .end { color:var(--dim); }
.hit .sum.old { opacity:.6; }
.hit .asked, .hit .said { color:var(--dim); font-size:12.5px; overflow:hidden;
                          display:-webkit-box; -webkit-box-orient:vertical; }
.hit .asked { -webkit-line-clamp:1; }
.hit .said { -webkit-line-clamp:3; }
.hit .wd { color:var(--faint); font-size:11.5px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
           white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.hit mark { background:color-mix(in srgb,var(--wait) 32%,transparent); color:inherit; border-radius:2px; }
header button { white-space: nowrap; }
</style>
</head>
<body>
<header>
  <h1><svg class="logo" viewBox="-12 -12 24 24" width="22" height="22" aria-hidden="true">
    <g fill="var(--claude)">
      <g id="ray"><path d="M0-10.5C1.5-6.2 1.5-3 0 0-1.5-3-1.5-6.2 0-10.5Z"/></g>
      <use href="#ray" transform="rotate(45)"/><use href="#ray" transform="rotate(90)"/>
      <use href="#ray" transform="rotate(135)"/><use href="#ray" transform="rotate(180)"/>
      <use href="#ray" transform="rotate(225)"/><use href="#ray" transform="rotate(270)"/>
      <use href="#ray" transform="rotate(315)"/>
    </g>
  </svg><span>agentview</span></h1>
  <span class="count" id="count"></span>
  <input id="q" class="q" type="search" placeholder="filter…  (/)" autocomplete="off">
  <span class="spacer"></span>
  <span class="stamp" id="stamp"></span>
  <input id="find" class="q" type="search" placeholder="search old conversations…" autocomplete="off"
         title="every interactive conversation on this machine, from any day, running ones included">
  <button id="closed" hidden title="conversations closed since the machine started: click one to resume it"></button>
  <button id="restore" hidden></button>
  <button id="save"></button>
  <button id="sound"></button>
  <div id="banners" role="status"></div>
</header>
<div id="closedlist" hidden></div>
<div id="found" hidden></div>
<main id="main" class="ov"><div class="empty">loading…</div></main>
<script>
let COLUMNS = [];           // the roster's `columns`, which the overview prints as they come
let SHOWN = [];             // the columns painted now: the filter may hide some of them
let CHIME = true;           // does a session that starts waiting ring?
let WAITING = null;         // who was waiting last poll -- null before the first
let READY = null;           // and who had already finished, for the same reason
let SPEAKER = null;         // the audio context, built on your first click
let MUZZLED = false;        // wanted to ring, and the browser would not have it
let PROVIDERS = {};         // who answered the last poll, and who did not
let COUNTS = {};            // the roster's header counts: needs, stuck, moving
let BANNERS = [];           // what is wrong with the whole machine, as the roster said
let LIGHT = "";             // the count you clicked, whose sessions are lit up -- "" for none
let query = "";
let editing = false;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const home = "{{HOME}}";        // substituted by the server, like the zoom
const ZOOM = parseFloat("{{ZOOM}}") || 1;

function mark(m) {
  // A tick reads as done in a way no colour of dot does.
  return m.flag === "ready" ? `<span class="tick">✓</span>`
    : `<span class="dot ${esc(m.status)}"></span>`;
}

function named(m) {
  // A provider that has no names for its sessions -- Codex has none -- puts
  // its own name where one would go; the title underneath says the rest.
  const p = String(m.provider || "");
  return p ? p[0].toUpperCase() + p.slice(1) : "(unnamed)";
}

// A JavaScript error used to be invisible: the poll stops, the page quietly
// goes stale, and nothing anywhere says why. Send it to the server so it
// lands in the same log as everything else -- deduped, because the poll fires
// every few seconds and a broken page would otherwise write a book.
const reported = new Map();
function report(where, message, stack) {
  const key = where + String(message);
  if (Date.now() - (reported.get(key) || 0) < 60000) return;
  reported.set(key, Date.now());
  fetch("/api/log", {
    method: "POST",
    headers: { "Content-Type": "application/json", "X-Fleet": "1" },
    body: JSON.stringify({ where, message: String(message).slice(0, 500),
                           stack: String(stack || "").slice(0, 2000) }),
  }).catch(() => {});      // the server being gone is what we were reporting
}
window.addEventListener("error", e => report("window", e.message, e.error?.stack));
window.addEventListener("unhandledrejection",
  e => report("promise", e.reason?.message ?? e.reason, e.reason?.stack));

function speaker() {
  // A browser makes no sound until you have interacted with the page, and a
  // context built before that stays suspended for good. So it is created on
  // demand, and `awake` asks it to resume every time.
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) return null;
  if (!SPEAKER) SPEAKER = new Ctx();
  return SPEAKER;
}

// resume() lands a moment after the call, and the state reads `suspended`
// until it does, so it is waited for. Without a click behind it the browser
// never settles the promise at all, hence the time limit.
async function awake(ctx) {
  if (ctx.state === "suspended")
    await Promise.race([ctx.resume().catch(() => {}),
                        new Promise(done => setTimeout(done, 300))]);
  return ctx.state === "running";
}

// One bell stroke. Everything else about the two sounds is how long it
// rings and how loud, so they are the same instrument either way.
//
// The graph takes its context so the sound can be rendered offline and
// measured. Nothing else can tell a working chime from a silent one.
function stroke(ctx, at, hz, peak, decay) {
  const note = ctx.createGain();
  // Exponential, and never to zero: a linear fade to silence clicks, and
  // exponentialRamp refuses 0 outright.
  note.gain.setValueAtTime(0.0001, at);
  note.gain.exponentialRampToValueAtTime(peak, at + 0.014);
  note.gain.exponentialRampToValueAtTime(0.0001, at + decay);
  note.connect(ctx.destination);
  // The octave above, kept quiet. A bare sine reads as a test tone; a
  // little of its own harmonic reads as a bell.
  for (const [f, share] of [[hz, 1], [hz * 2, 0.14]]) {
    const osc = ctx.createOscillator();
    osc.type = "sine";
    osc.frequency.value = f;
    const part = ctx.createGain();
    part.gain.value = share;
    osc.connect(part).connect(note);
    osc.start(at);
    osc.stop(at + decay + 0.1);
  }
}

// The cabin chime: two strokes, high then low, with a long decay. It is the
// seatbelt sign, not a doorbell -- it should say there is something for you
// without ever making you jump.
function tone(ctx) {
  const t = ctx.currentTime + 0.02;
  stroke(ctx, t, 1174.7, 0.15, 1.8);
  stroke(ctx, t + 0.42, 880, 0.12, 1.8);
}

// A tick: the same bell, struck once and quickly gone. Something finished,
// which is good news and not a summons -- it should be over before you have
// finished turning your head.
function blip(ctx) {
  stroke(ctx, ctx.currentTime + 0.02, 1174.7, 0.13, 0.3);
}

async function play(shape) {
  const ctx = speaker();
  if (!ctx || !await awake(ctx)) { muzzled(true); return false; }
  muzzled(false);
  shape(ctx);
  return true;
}

function ring() { return play(tone); }
function tick() { return play(blip); }

function muzzled(state) {
  if (MUZZLED === state) return;
  MUZZLED = state;
  drawSound();
}

// Both sets are null until the first roster lands, so opening the page is
// silent even with three questions and five ticks already on it: the sound
// is for what happens while you are looking away.
function arrived(now, before) {
  return before && [...now].some(sid => !before.has(sid));
}

// Sound once per poll, for whoever *started* waiting or finishing. Five
// sessions landing together is one chime, not five -- and a session goes on
// waiting without ever ringing twice.
function announce(flags) {
  const waiting = new Set(), ready = new Set();
  for (const f of flags) {
    // `blocked` rings with `waiting`, exactly as the header counts it: a
    // session that wrote down what it is blocked on is asking, and its turn
    // being over does not make it ready. Without this a session that reports
    // a blocker through `team-line --n 1` plays the tick -- the sound that
    // means nothing is wanted from you (2026-09-22: a real blocker went
    // unheard that way).
    if (f.flag === "waiting" || f.blocked) waiting.add(f.key);
    else if (f.flag === "ready") ready.add(f.key);
  }
  const asks = arrived(waiting, WAITING);
  const done = arrived(ready, READY);
  WAITING = waiting;
  READY = ready;
  // A question outranks a finished turn. If both land in the same poll you
  // hear the one that wants something from you.
  if (!CHIME) return;
  if (asks) ring();
  else if (done) tick();
}

function drawSound() {
  const button = document.getElementById("sound");
  button.textContent = MUZZLED ? "allow sound" : CHIME ? "chime" : "muted";
  button.classList.toggle("armed", CHIME && !MUZZLED);
  button.classList.toggle("blocked", MUZZLED);
  button.title = MUZZLED
    ? "the browser holds back sound until you have clicked the page — click here"
    : CHIME ? "a chime when a session starts waiting, a tick when one finishes"
            : "silent whether a session starts waiting or finishes";
}

function busyWithUser() {
  return editing || !!document.querySelector("input.inline, select.pick");
}

async function load() {
  // A save can take seconds -- retitling a Konsole tab means walking D-Bus --
  // and its `load()` lands long after. By then you may be typing in another
  // field, and re-rendering would rip it out. Whoever asked, the answer is
  // the same: not while a field is open.
  if (busyWithUser()) return;
  try {
    const r = await fetch("/api/roster", { cache: "no-store" });
    // Checked again on the far side of the await: a poll that set off a
    // moment before you clicked would otherwise land now and wipe the field
    // you have already started typing in.
    const { flags, columns, counts, banners, chime, providers, restore, saved, closed } = await r.json();
    drawRestore(restore);
    drawClosed(closed);
    drawSave(saved);
    PROVIDERS = providers || {};
    if (busyWithUser()) return;
    // Read back on every poll, so editing config.json by hand still works.
    CHIME = chime !== false;
    drawSound();
    announce(flags || []);
    COLUMNS = columns || [];
    COUNTS = counts || {};
    BANNERS = Array.isArray(banners) ? banners : [];
    paint();
  } catch (e) {
    document.getElementById("stamp").textContent = "server unreachable";
    report("poll", e.message, e.stack);
  }
}

// A click that only changes how the roster in hand is drawn (a lit count, the
// notes link) repaints from it: waiting for the next poll would make the click
// feel like it missed.
function paint() {
  // One provider down is that provider's badge, not a blank page.
  const down = Object.entries(PROVIDERS).filter(([, p]) => !p.ok).map(([name, p]) =>
        ` &nbsp;·&nbsp; <span class="alarm" title="${esc(p.error)}">${esc(name)} down</span>`).join("");
  const shown = filteredColumns(COLUMNS);
  // A lit count that has emptied since (the question was answered) has nothing
  // left to light: it clears, rather than hide every session.
  if (LIGHT && !countOf(LIGHT)) LIGHT = "";
  drawBanners();
  drawHead(shown, down);
  // The tab title is the header's "need you" count, read from the same place,
  // so the two cannot differ.
  const wants = countOf("needs");
  document.title = wants ? `(${wants}) agentview` : "agentview";
  overview(shown);
  document.getElementById("stamp").textContent = stampText();
}

// The line over the header: when the roster was read, or -- for a few seconds
// after a refusal -- what happened, so that the next poll does not wipe it.
let NOTE = null;
function stampText() {
  return NOTE && Date.now() < NOTE.until ? NOTE.text : "updated " + new Date().toLocaleTimeString();
}

function nothing() {
  return `<div class="empty">${query.trim().length >= 3
    ? `Nothing matches “${esc(query.trim())}”.` : "No sessions running."}</div>`;
}

// The overview prints `columns` as the server sent them: which sessions share
// a column, and in what order, was decided there. Everything below is text
// going into text positions through esc() -- a name or a line is whatever a
// session called itself, and never markup.
function filteredColumns(cols) {
  // From three characters, and a project that matches keeps all its sessions.
  const q = query.trim().toLowerCase();
  if (q.length < 3) return cols;
  const hit = s => String(s || "").toLowerCase().includes(q);
  return cols.map(c => {
    if (hit(c.name) || hit(c.raw)) return c;
    const sessions = c.sessions.filter(t => hit(t.find));
    const pills = (c.pills || []).filter(p => hit(p.find));
    return sessions.length || pills.length ? { ...c, sessions, pills } : null;
  }).filter(Boolean);
}

function overview(cols) {
  SHOWN = cols;
  const main = document.getElementById("main");
  const x = main.scrollLeft;          // a repaint every poll must not send you back to the first column
  main.innerHTML = cols.length ? cols.map(column).join("") : nothing();
  main.scrollLeft = x;
}

// The words of the header's three counts. The roster counts; this is only how
// each is said, and what a click on it lights up (`counted` on a tile).
const COUNT_WORD = { needs: n => n === 1 ? "needs you" : "need you",
                     otherStuck: () => "other stuck", moving: () => "moving" };

// The count the page shows for a key: the roster's number when it is a whole
// number above nothing, and 0 for anything else. The header and the clear-on-
// empty both read it, so a count that prints as 0 is never one that is lit.
const countOf = k => Number.isInteger(COUNTS[k]) && COUNTS[k] > 0 ? COUNTS[k] : 0;

// The overview's header: what is on the page, then the roster's three counts,
// each a button that lights up its sessions. A count of nothing has nothing to
// light, so its button is off. Written again only when it changed, so that a
// click is never lost to a repaint between its press and its release.
let HEAD_SHOWN = "";
function drawHead(cols, down) {
  const all = list => list.reduce((a, c) => a + c.sessions.length, 0);
  const total = all(cols), everyone = all(COLUMNS);
  const buttons = Object.keys(COUNT_WORD).map(k => {
    const n = countOf(k);
    return `<button class="hc ${k}" data-count="${k}" aria-pressed="${LIGHT === k}" ${n ? "" : "disabled"}
      title="${n ? "light up these sessions; click again to clear" : "none"}">${n} ${COUNT_WORD[k](n)}</button>`;
  }).join(" &nbsp;·&nbsp; ");
  const html = `${total} ${total === 1 ? "session" : "sessions"} · ${cols.length} ${cols.length === 1 ? "project" : "projects"}`
    + (total < everyone ? ` <span class="hidden-note">(${everyone - total} filtered out)</span>` : "")
    + ` &nbsp;·&nbsp; ${buttons}${down}`;
  if (html === HEAD_SHOWN) return;
  HEAD_SHOWN = html;
  // Rebuilding the buttons drops the focus from the one that has it, so a
  // keyboard press (Enter to light, Enter again to clear) would stop at the
  // first. Put it back on the button of the same count.
  const held = document.activeElement?.closest("button.hc")?.dataset.count;
  document.getElementById("count").innerHTML = html;
  if (held && known(COUNT_WORD, held)) document.querySelector(`#count button.hc[data-count="${held}"]`)?.focus();
}

// What is wrong with the whole machine: one band each, as the roster named it.
// The roster is the only place this comes from, and its words are text. Written
// again only when the list changed, like the header.
let BANNERS_SHOWN = "";
function drawBanners() {
  const list = BANNERS.filter(b => b && typeof b.text === "string" && b.text);
  const key = JSON.stringify(list);
  if (key === BANNERS_SHOWN) return;
  BANNERS_SHOWN = key;
  document.getElementById("banners").replaceChildren(...list.map(b => {
    const el = document.createElement("div");
    el.className = "banner";
    el.textContent = b.text;
    return el;
  }));
}

// What a table says about a key, and nothing a plain object inherits: a kind
// the server calls "constructor" is not on the list.
const known = (table, key) => Object.prototype.hasOwnProperty.call(table, key) ? table[key] : "";

// The card's state word. The server decides the state (the most urgent of its
// sessions); this is only how each is said.
const STATE_WORD = { needs: "NEEDS YOU", error: "ERROR", hung: "HUNG", limit: "LIMIT",
                     moving: "MOVING", idle: "ALL IDLE" };

function column(c) {
  // The state is always the card's second line, never above the name.
  const said = known(STATE_WORD, c.state);
  const word = said || (c.state ? String(c.state).toUpperCase() : "");
  const st = said ? c.state : "other";
  // Lit up: a column with none of those sessions is only its card.
  const shrunk = LIGHT && !c.sessions.some(t => t.counted === LIGHT);
  return `<section class="ov-col ${shrunk ? "shrunk" : ""}" data-project="${esc(c.project)}">
    <div class="ov-head st-${st} ${c.pinned ? "pinned" : ""}">${headOf(c)}${word ? `<span class="ov-state">${esc(word)}</span>` : ""}${contextOf(c)}${footOf(c)}${movementOf(c)}${mergedOf(c)}</div>
    ${c.sessions.map(tile).join("")}
    ${pillsOf(c)}
  </section>`;
}

// What the project is about, as the server chose it. A line of your own is
// edited where it stands; a guess is greyed and invites a line of your own.
function contextOf(c) {
  const x = c.context;
  if (!x) return "";
  const mine = x.source === "own" ? x.full : "";
  const add = x.guess ? `${x.line ? " " : ""}<span class="add">add a line</span>` : "";
  return `<div class="ov-ctx edit ${x.guess ? "maybe" : ""}" data-edit="context" data-value="${esc(mine)}"
    title="${esc(x.full)}">${esc(x.line)}${add}</div>`;
}

// A track's progress, as the server counted it.
function progressOf(c) {
  const p = c.track?.progress;
  return p ? `<span class="ov-bar" aria-hidden="true"><i style="width:${
    p.total ? Math.round(Math.min(p.done, p.total) / p.total * 100) : 100}%"></i></span><span>${esc(p.text)}</span>` : "";
}

function notesLinkOf(c) {
  return c.notes ? `<a class="ov-notes ${NOTES.has(c.project) ? "on" : ""}" href="#"
    data-query="${esc(c.notes.query)}">notes</a>` : "";
}

// The row under the context line: progress, the notes link, and whatever the
// last click on that link found.
function footOf(c) {
  const bar = progressOf(c), note = notesLinkOf(c);
  return bar || note ? `<div class="ov-prog">${bar}${note}</div>${hitsOf(c)}` : "";
}

// Notes are looked up when the link is clicked, and only then.
const NOTES = new Map();      // project -> what its last click found, until clicked away
function hitsOf(c) {
  const n = NOTES.get(c.project);
  if (!n) return "";
  const hits = Array.isArray(n.hits) ? n.hits : [];
  const body = n.wait ? "searching…"
    : !n.ok ? esc(n.reason || "notes search failed")
    : hits.length ? hits.map(h => `<div><div class="hit-title" title="${esc(h.path)}">${esc(h.title || h.path)}</div>
        <div class="hit-snip">${esc(h.snippet)}</div></div>`).join("")
    : "nothing found";
  return `<div class="ov-hits">${body}</div>`;
}

// What you moved into this project, each with the way back. Undoing puts the
// project back as its own; its pin, name and line were carried and stay here.
function mergedOf(c) {
  if (!(c.merged || []).length) return "";
  return `<div class="ov-merged">${c.merged.map(m => `<span>includes ${esc(m.name)}
    <button data-act="unmerge" data-from="${esc(m.project)}"
      title="make ${esc(m.name)} its own project again (its pin, name and line are not given back)">undo</button></span>`).join("")}</div>`;
}

// The name, and what you can do to the project: pin it, move a pinned one
// along the row, merge it into another. A project is what you correct, so
// "No project" -- the pile of sessions waiting for one -- has none of it.
// The raw name stays on hover: renaming never hides what it is.
function headOf(c) {
  if (c.kind === "none") return `<div class="ov-top"><span class="ov-name">${esc(c.name)}</span></div>`;
  // The neighbours are the cards on the page, not those a filter has hidden.
  const pins = SHOWN.filter(x => x.pinned);
  const at = pins.findIndex(x => x.project === c.project);
  const arrow = (to, glyph, word) => to ? `<button class="ov-arrow" data-act="swap" data-with="${esc(to.project)}" data-side="${word}"
      title="${word} of ${esc(to.name)}" aria-label="${word} of ${esc(to.name)}">${glyph}</button>` : "";
  // A track's status word sits beside its name; a name that is not the raw one carries the raw
  // for the hover, in grey after it.
  const tag = c.track?.status
    ? `<span class="ov-tag ${esc(c.track.status.toLowerCase())}">${esc(c.track.status)}</span>` : "";
  const raw = c.raw && c.raw !== c.name ? ` data-raw="${esc(c.raw)}"` : "";
  return `<div class="ov-top">
    <span class="ov-name edit" data-edit="name"${raw} title="${esc(c.raw)}: click to rename">${esc(c.name)}</span>${tag}
    <span class="ov-tools">
      ${c.pinned ? arrow(pins[at - 1], "‹", "before") + arrow(pins[at + 1], "›", "after") : ""}
      <button class="ov-pin ${c.pinned ? "on" : ""}" data-act="${c.pinned ? "unpin" : "pin"}"
        title="${c.pinned ? "pinned: click to unpin" : "pin to the front"}"
        aria-pressed="${c.pinned ? "true" : "false"}">${c.pinned ? "★" : "☆"}</button>
      <button class="ov-merge" data-act="merge-form"
        title="merge all of it into another project; holds for sessions that start later">merge…</button>
    </span>
  </div>`;
}

// The card's movement: the strip the server summed over the project's
// sessions, and the mix under it. Heights are scaled to the busiest minute
// shown; the counts themselves are the server's.
function movementOf(c) {
  const bars = (c.strip || []).map(v => v === null ? null : Number(v) || 0);
  const top = Math.max(1, ...bars.filter(v => v !== null));
  const bar = v => v === null ? `<i class="u" title="not seen"></i>`
    : v === 0 ? `<i class="z" title="0 writes"></i>`
    : `<i style="height:${Math.max(2, Math.round(v / top * 28))}px" title="${v} writes"></i>`;
  const m = Object.fromEntries(["moving", "stuck", "idle"].map(k => [k, Number(c.summary?.[k]) || 0]));
  return `<div class="ov-mv">
    <div class="strip" role="img" aria-label="Writes per minute, last 30 minutes">${bars.map(bar).join("")}</div>
    <div class="mix">${m.moving} moving · ${m.stuck} stuck · ${m.idle} idle</div>
  </div>`;
}

// The kinds of stuck a tile can carry, and the word on its tag. The class on
// the tile comes from this list, never from the server's text.
const KIND_TAG = { needs: "needs you", error: "error", hung: "hung", limit: "limit" };

// Where a tile's working-on line came from, and how it is said: the last
// prompt, the branch and the folder stand in for a line, so they are greyed.
// The class comes from this list too.
const LINE_CLASS = { own: "", did: "", title: "", prompt: "stand-in", place: "stand-in" };

function tile(t) {
  const kind = known(KIND_TAG, t.stuck?.kind) ? t.stuck.kind : "";
  const needs = kind === "needs" ? " needs" : "";
  // Error, Hung and Limit are told by their kind alone: the dot is theirs, not
  // a tick for a finished turn, and no flag of the old pages is added to it.
  const notNeeds = kind && kind !== "needs";
  const alarm = notNeeds ? kind : (["waiting", "stuck", "ready"].includes(t.flag) ? t.flag : "") + needs;
  const via = t.jump?.via;
  const can = via === "pane" || via === "attach";
  const tags = (t.tags || []).map(g =>
    `<span class="bg-tag ${esc(g)}">${esc(g)}</span>`).join("");
  const light = lightOf(t);
  return `<div class="tile ${can ? "can" : ""} ${alarm}${light}" data-sid="${esc(t.key)}">
    <div class="rhead">
      ${mark({ ...t, flag: notNeeds ? "" : t.flag, status: t.moving ? "busy" : t.status })}<span class="nm">${esc(t.name || named(t))}</span>${tags}${tileFlag(t)}${unpinButton(t)}${moveButton(t)}${jumpLabel(t, via)}
    </div>
    ${t.line ? `<div class="tline ${known(LINE_CLASS, t.lineSource)}" title="${esc(t.line)}">${esc(t.line)}</div>` : ""}
    ${t.movement ? `<div class="mv">${esc(t.movement.text)}</div>` : ""}
    ${t.handover ? `<div class="said">“${esc(t.handover)}”</div>` : ""}
    ${stuckBox(t)}
    ${handRow(t)}
  </div>`;
}

// Finished sessions, as the server chose them: one line each, name and idle
// time, the working-on line as the hover, a click to jump. A pill that has
// nowhere to go says so before the click and does nothing when clicked: it was
// read already, and a click that reaches nothing has shown you nothing.
function pillsOf(c) {
  const list = (c.pills || []).filter(p => p && typeof p.key === "string");
  return list.length ? `<div class="pills">${list.map(pill).join("")}</div>` : "";
}

function pill(p) {
  const via = p.jump?.via;
  const can = via === "pane" || via === "attach";
  const tags = (p.tags || []).map(g => `<span class="bg-tag ${esc(g)}">${esc(g)}</span>`).join("");
  return `<div class="pill ${can ? "can" : ""}${lightOf(p)}" data-sid="${esc(p.key)}" title="${esc(p.line)}">
    <span class="dot"></span><span class="nm">${esc(p.name || named(p))}</span>${tags}<span class="for">${esc(p.idle?.text)}</span>${pinButton(p)}${jumpLabel(p, via)}
  </div>`;
}

// Lit or faded while a header count is lit up: by the count the roster says the
// tile or pill is in (a pill is in none).
function lightOf(t) {
  return !LIGHT ? "" : t.counted === LIGHT ? " lit" : " dim";
}

// Pin a pill open as a tile, or let a pinned tile shrink again. The server
// keeps the pin until it is undone or the session closes.
function pinButton(p) {
  return `<button class="keep" data-sid="${esc(p.key)}" aria-pressed="false"
    title="keep it open as a full tile until you unpin it or it closes">pin</button>`;
}

function unpinButton(t) {
  return t.pinned ? `<button class="keep on" data-sid="${esc(t.key)}" data-pinned="1" aria-pressed="true"
    title="pinned open: click to let it shrink to a pill again when it is finished">unpin</button>` : "";
}

// A span of minutes the way the server says it ("<1 min", "14 min", "3 h").
function minutesText(min) {
  const m = Number(min);
  if (!(m >= 0)) return "";
  if (m < 1) return "<1 min";
  if (m < 60) return `${Math.floor(m)} min`;
  if (m < 48 * 60) return `${Math.floor(m / 60)} h`;
  return `${Math.floor(m / 1440)} d`;
}

// A moment the way it is read on a clock: the time today, the day and the
// time on any other day.
function clock(ms) {
  const d = new Date(ms);
  const time = d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  return d.toDateString() === new Date().toDateString() ? time
    : `${d.toLocaleDateString([], { weekday: "short" })} ${time}`;
}

// What you can do to one session. The button puts it in any project, for as
// long as the session lasts; the chip (in No project) is where the roster
// thinks it belongs, and once you have moved it the way back is always there.
function moveButton(t) {
  return `<button class="move" data-sid="${esc(t.key)}" aria-label="move this session to another project"
    title="move this session to another project (for this session only)">⋯</button>`;
}

function handRow(t) {
  const back = t.assigned ? `<span class="clear" data-sid="${esc(t.key)}"
    title="back to the project it belongs to">moved by you · back</span>` : "";
  return t.suggestion || back ? `<div class="assign hand">${t.suggestion ? suggestionChip(t) : ""}${back}</div>` : "";
}

// Why a session is stopped, and what you need to know before you go to it.
// Every word here was written by a session or a person: it goes into the page
// as text, through esc(), and nowhere else.
function stuckBox(t) {
  const s = t.stuck;
  // No kind: a session that only asked something in its last words still
  // shows it, the way the tile always has.
  if (!s) return t.need ? `<div class="need">${esc(t.need)}</div>` : "";
  const c = s.context || {};
  let body = "";
  if (s.source === "question" && !(c.questions || []).length) {
    // The dialog is open; Claude Code has not written its question down yet.
    body = `<div class="late">Its question is not in the transcript yet.</div>`;
  } else if (s.source === "question") {
    body = (c.questions || []).map(q => `<div>
      <div class="qtext">${q.header ? `<span class="qh">${esc(q.header)}${q.multi ? " · several" : ""}</span>` : ""}${esc(q.question)}</div>
      <ul>${(q.options || []).map(o => `<li><span class="ol">${esc(o.label)}</span>${o.description ? `<span class="od"> — ${esc(o.description)}</span>` : ""}</li>`).join("")}</ul>
    </div>`).join("");
  } else if (s.source === "permission") {
    const what = c.command || c.target;
    body = `<div class="cmd"><span class="tool">${esc(c.tool || "a tool")}</span>${c.copy ? copyButton(t.key) : ""}${what ? `<code>${esc(what)}</code>` : ""}</div>`;
  } else if (s.kind === "limit") {
    // Where the reset is, and how long it has been held. A reset already past
    // still says so: the session has not picked up again.
    const reset = Number(c.resetsAt) > 0 ? `${c.resetsAt > Date.now() ? "resets" : "reset"} ${clock(c.resetsAt)}` : "";
    const held = c.held == null ? "" : `held ${minutesText(c.held)}`;
    const line = [reset, held].filter(Boolean).join(" · ");
    body = line ? `<div class="late">${esc(line)}</div>` : (c.text ? `<div class="say">${esc(c.text)}</div>` : "");
  } else if (s.kind === "error") {
    body = (c.text ? `<div class="say">${esc(c.text)}</div>` : "")
         + (c.ago == null ? "" : `<div class="late">${esc(minutesText(c.ago))} ago</div>`);
  } else if (s.kind === "hung") {
    body = c.tool
      ? `<div class="late">last tool: ${esc(c.tool)}${c.ago == null ? "" : ` · ${esc(minutesText(c.ago))} ago`}</div>`
      : `<div class="late">no tool called yet</div>`;
  } else if (c.text) {
    body = `<div class="say">${esc(c.text)}</div>`;
  }
  // Its own class, not `.why`: a jump clears the tile's `.why` (the note a
  // failed jump leaves) and must not clear the reason with it.
  return `<div class="stuck-box ${esc(s.kind)}"><div class="reason">${esc(s.reason)}</div>${body}</div>`;
}

// The copy button is on a command and nowhere else. It puts the command on
// the clipboard and does nothing to the session: answering stays in its pane.
let COPIED = { key: "", until: 0, ok: true };

function copyButton(key) {
  const now = COPIED.key === key && Date.now() < COPIED.until;
  return `<button type="button" class="copy" data-sid="${esc(key)}" title="Copy the command. This does not answer the session.">${now ? (COPIED.ok ? "copied" : "not copied") : "copy"}</button>`;
}

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (e) { /* no clipboard API here */ }
  try {
    const box = document.createElement("textarea");
    box.value = text;
    box.style.cssText = "position:fixed;opacity:0;top:0;left:0";
    document.body.appendChild(box);
    box.select();
    const ok = document.execCommand("copy");
    box.remove();
    return ok;
  } catch (e) { return false; }
}

// Registered before the tile's own click below, and it stops there: a click on
// copy is not a click on the tile, so it neither jumps nor marks it seen.
document.getElementById("main").addEventListener("click", async ev => {
  const button = ev.target.closest("button.copy");
  if (!button) return;
  ev.stopImmediatePropagation();
  ev.preventDefault();
  // The command comes from the roster, not from the page's text: what is
  // copied is what the server sent, character for character.
  const sent = COLUMNS.flatMap(c => c.sessions).find(x => x.key === button.dataset.sid);
  const command = sent?.stuck?.context?.copy ? sent.stuck.context.command : "";
  if (!command) return;
  const ok = await copyText(command);
  COPIED = { key: sent.key, until: Date.now() + 1500, ok };
  button.textContent = ok ? "copied" : "not copied";
  setTimeout(() => { if (button.isConnected) button.textContent = "copy"; }, 1500);
});

// In No project: where the roster thinks this session belongs, one click away.
// The click is the page's existing `.guess` handler, which assigns it.
function suggestionChip(t) {
  return `<span class="guess" data-sid="${esc(t.key)}"
    data-project="${esc(t.suggestion.project)}">→ ${esc(t.suggestion.name)}</span>`;
}

// The jump is worked out by the server before anyone clicks: a pane to raise,
// a new tab that attaches, or none -- and then it says so, greyed, instead of
// leaving you to click for nothing.
function jumpLabel(t, via) {
  if (via === "pane") return `<span class="go">open ↗</span>`;
  if (via === "attach") return `<span class="go">attach ↗</span>`;
  return `<span class="go none" title="${esc(t.jump?.reason || "no terminal")}">no terminal</span>`;
}

function tileFlag(t) {
  // A kind says what the flag would, and says it once.
  const kind = t.stuck?.kind;
  const tag = known(KIND_TAG, kind);
  if (tag) return `<span class="flag ${esc(kind)}">${esc(tag)}</span>`;
  // `flagNote` is finished by the server: what a waiting session is blocked
  // on, or the minutes a stuck session has been quiet and a tool call has run.
  return t.flag === "waiting"
    ? `<span class="flag waiting">waiting</span>` + (t.flagNote ? `<span class="wf">${esc(t.flagNote)}</span>` : "")
    : t.flag === "stuck"
      ? `<span class="flag stuck">stuck ${esc(t.flagNote)}</span>`
      : t.flag === "ready" ? `<span class="flag ready">ready</span>`
        // Seen by the chime's marks, not yet read here: it stays a tile.
        : t.unread ? `<span class="flag unread">unread</span>` : "";
}

// A tile is a session you can go to: click it and its terminal comes to the
// front. The page never guesses how: the server works out whether that means
// WezTerm, tmux or Konsole. A control inside a tile that picks something (move,
// keep, the forms) is a click on that control, never a jump: see the guard.
// The click is acknowledged *now*, before the answer: raising the terminal
// takes the focus off this page, and a browser throttles a page it is not
// showing -- feedback that waits for the response is feedback you never see.
document.getElementById("main").addEventListener("click", async ev => {
  const el = ev.target.closest(".tile, .pill");
  if (!el || ev.target.closest(".hand, .move, .keep, .ov-form")) return;   // these pick; none of them jumps
  const post = (path, body) => fetch(path, {
    method: "POST",
    headers: { "Content-Type": "application/json", "X-Fleet": "1" },
    body: JSON.stringify(body),
  });
  if (!el.classList.contains("can")) {
    // A tile with no terminal is looked at, and that is all a click means. A
    // pill was read already and has nothing new on its face: its click only
    // says why it cannot open, and marks nothing.
    if (el.classList.contains("pill")) {
      const p = COLUMNS.flatMap(c => c.pills || []).find(x => x.key === el.dataset.sid);
      return say(el.dataset.sid, p?.jump?.reason || "no terminal", false);
    }
    // With the stop whose handover the tile showed: only that one is read.
    const tile = COLUMNS.flatMap(c => c.sessions || []).find(x => x.key === el.dataset.sid);
    post("/api/seen", { key: el.dataset.sid, stop: tile?.stop }).then(load).catch(() => {});
    return;
  }
  el.classList.remove("jumped", "failed");
  el.querySelector(".why")?.remove();
  void el.offsetWidth;
  el.classList.add("jumped");
  const key = el.dataset.sid;
  try {
    const out = await (await post("/api/jump", { key })).json();
    if (!out.ok) say(key, out.reason || "jump failed", true);
    else if (out.did === "opening") say(key, "opening a tab for it…", false);
  } catch (e) {
    say(key, "jump failed", true);
  }
});

// What a jump has to say sits on the tile itself until the next poll repaints
// the page. The tile is found again by its key: a slow jump is answered after
// a poll has replaced every node, and the one that was clicked is gone.
function say(key, text, bad) {
  const el = [...document.querySelectorAll(".tile, .pill")].find(t => t.dataset.sid === key);
  if (!el) return;
  el.classList.remove("jumped");
  el.querySelector(".why")?.remove();
  const why = document.createElement("div");
  why.className = bad ? "why" : "why note";
  why.textContent = text;
  el.append(why);
  if (bad) {
    el.classList.add("failed");
    document.getElementById("stamp").textContent = text;
  }
}

// Inline editing. The poll is paused while a field is open, otherwise a
// refresh would tear the input out from under the cursor.
document.getElementById("main").addEventListener("click", ev => {
  const cell = ev.target.closest(".edit");
  // `editing` can survive a field that never got closed -- a blur that
  // arrived while the window was in the background, say -- so the DOM is the
  // authority on whether one is already open. Never two at once.
  if (!cell || editing || document.querySelector("input.inline")) return;
  ev.stopPropagation();
  ev.preventDefault();
  const kind = cell.dataset.edit;
  // Read everything off the cell now: the field replaces it, and by the time
  // the edit is committed neither is still in the document.
  const project = cell.closest("section")?.dataset.project;
  const before = cell.dataset.value !== undefined ? cell.dataset.value
    : cell.textContent.trim() === "—" ? "" : cell.textContent.trim();
  const input = document.createElement("input");
  input.className = "inline";
  input.value = before;
  editing = true;
  cell.replaceWith(input);
  input.focus();
  input.select();

  const finish = async commit => {
    if (!editing) return;
    editing = false;
    // Take the field out first: `load()` refuses to redraw while one is open,
    // and this one is the reason it was asked to redraw.
    input.remove();
    if (commit && input.value.trim() !== before) {
      const endpoint = { name: "/api/name", context: "/api/context" }[kind];
      const body = kind === "name"
        ? { project, label: input.value }
        : { project, text: input.value };
      const r = await fetch(endpoint, {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-Fleet": "1" },
        body: JSON.stringify(body),
      });
      if (await changedElsewhere(r)) return;
    }
    load();
  };
  input.addEventListener("keydown", e => {
    if (e.key === "Enter") finish(true);
    if (e.key === "Escape") finish(false);
  });
  input.addEventListener("blur", () => {
    // Alt-tabbing away, or a terminal coming to the front, must not commit
    // and re-render behind your back -- come back and the field is as you
    // left it.
    if (!document.hasFocus()) return;
    finish(true);
  });
});

// The notes link on a card: one search of your notes, when it is clicked and
// not before. Clicking again puts the answer away.
document.getElementById("main").addEventListener("click", async ev => {
  const link = ev.target.closest(".ov-notes");
  if (!link) return;
  ev.preventDefault();
  const project = link.closest("section")?.dataset.project;
  const query = link.dataset.query;
  // Repainting while a field is open would take it away from you; the next poll
  // draws what is waiting, as soon as the field is closed.
  const show = () => { if (!busyWithUser()) paint(); };
  if (NOTES.has(project)) { NOTES.delete(project); show(); return; }
  NOTES.set(project, { wait: true });
  show();
  let found = { ok: false, reason: "notes search failed" };
  try {
    const r = await fetch("/api/notes", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Fleet": "1" },
      body: JSON.stringify({ query }),
    });
    if (r.ok) found = await r.json();
  } catch (e) { /* the card says it failed */ }
  if (NOTES.has(project)) { NOTES.set(project, found); show(); }      // not if you clicked it away meanwhile
});

function assign(sid, project) {
  return correct("/api/assign", { key: sid, project });
}

document.getElementById("main").addEventListener("click", ev => {
  const guess = ev.target.closest(".guess");
  if (guess) { ev.stopPropagation(); return assign(guess.dataset.sid, guess.dataset.project); }
  const clear = ev.target.closest(".clear");
  if (clear) { ev.stopPropagation(); return assign(clear.dataset.sid, ""); }
});

// By hand. Every click is one correction, made by the server on its own, so
// two in quick succession (or from two tabs) both hold. A picker keeps the
// poll from repainting while it is open, as an inline field does, and goes
// when you press Escape or click away.
async function correct(path, body) {
  const r = await fetch(path, {
    method: "POST",
    headers: { "Content-Type": "application/json", "X-Fleet": "1" },
    body: JSON.stringify(body),
  });
  if (await changedElsewhere(r)) return;
  if (!r.ok) document.getElementById("stamp").textContent = "not done: " + (r.statusText || r.status);
  load();
}

// 409: another tab changed the card this page drew, so nothing was written.
// Read the roster again and say so, calmly: the line holds for a few seconds.
async function changedElsewhere(r) {
  if (r.status !== 409) return false;
  NOTE = { text: "changed in another tab, refreshed", until: Date.now() + 6000 };
  await load();
  document.getElementById("stamp").textContent = stampText();
  return true;
}

// Other projects you can put something in, named so two with one name differ:
// by kind, then (a client folder and a folder are both folders) by what the
// identity starts with, then -- two repositories called alike -- by the identity.
function projectOptions(except) {
  const open = COLUMNS.filter(c => c.kind !== "none" && c.project !== except);
  const prefix = c => c.project.split(":", 1)[0];
  const tag = c => {
    const same = open.filter(o => o.name === c.name);
    if (same.length < 2) return "";
    if (same.filter(o => o.kind === c.kind).length < 2) return ` (${c.kind})`;
    if (same.filter(o => prefix(o) === prefix(c)).length < 2) return ` (${prefix(c)})`;
    return ` (${c.project})`;
  };
  return open.map(c => `<option value="${esc(c.project)}">${esc(c.name)}${esc(tag(c))}</option>`).join("");
}

// Closed once: taking out the button you pressed fires its focusout, and that
// would close the picker a second time from inside the first.
function closePicker(form, then = load) {
  if (form.dataset.closed) return;
  form.dataset.closed = "1";
  form.remove();
  then();
}

function picker(host, html, onChoose) {
  if (document.querySelector("select.pick") || editing) return null;
  const form = document.createElement("div");
  form.className = "ov-form";
  form.innerHTML = html;
  host.append(form);
  const sel = form.querySelector("select.pick");
  sel.focus();
  form.addEventListener("keydown", e => { if (e.key === "Escape") closePicker(form); });
  form.addEventListener("focusout", e => {
    // Leaving the page for another window must not drop what you were choosing.
    if (!form.contains(e.relatedTarget) && document.hasFocus()) closePicker(form);
  });
  form.addEventListener("click", e => {
    const go = e.target.closest("[data-act]")?.dataset.act;
    if (go === "cancel") closePicker(form);
    if (go === "go" && sel.value) closePicker(form, () => onChoose(sel.value));
  });
  return form;
}

document.getElementById("main").addEventListener("click", async ev => {
  const col = ev.target.closest(".ov-col");
  if (!col) return;
  const project = col.dataset.project;
  const keep = ev.target.closest(".keep");
  if (keep) {
    ev.stopPropagation();
    fetch("/api/keep", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Fleet": "1" },
      body: JSON.stringify({ key: keep.dataset.sid, pinned: keep.dataset.pinned !== "1" }),
    }).then(load).catch(() => {});
    return;
  }
  const move = ev.target.closest(".move");
  if (move) {
    ev.stopPropagation();
    const sid = move.dataset.sid;
    picker(move.closest(".tile"), `<select class="pick" aria-label="move this session to">
        <option value="" disabled selected>move this session to…</option>${projectOptions(project)}</select>
        <button data-act="go">move</button><button data-act="cancel">cancel</button>`,
      to => correct("/api/assign", { key: sid, project: to }));
    return;
  }
  const act = ev.target.closest("[data-act]");
  if (!act || act.closest(".ov-form")) return;
  ev.stopPropagation();
  const what = act.dataset.act;
  // The server is told which cards are pinned as you see them: a pin written
  // by plain name can hold two cards, and only the page knows which is which.
  const shown = COLUMNS.filter(c => c.pinned).map(c => c.project);
  if (what === "pin" || what === "unpin") return correct("/api/pin", { project, action: what, shown });
  // The arrow says which way it goes and the undo says where it saw the project,
  // so that the same click from a tab that is behind is refused, not repeated.
  if (what === "swap") return correct("/api/pin", { project, action: "swap", with: act.dataset.with, side: act.dataset.side, shown });
  if (what === "unmerge") return correct("/api/assign", { key: act.dataset.from, project: "", was: project });
  if (what === "merge-form") {
    picker(col.querySelector(".ov-head"), `merge all of it into
        <select class="pick" aria-label="merge into">
        <option value="" disabled selected>choose…</option>${projectOptions(project)}</select>
        <button data-act="go">merge</button><button data-act="cancel">cancel</button>`,
      into => correct("/api/merge", { source: project, target: into, shown }));
  }
});

const box = document.getElementById("q");
box.addEventListener("input", () => { query = box.value; load(); });
box.addEventListener("keydown", e => {
  if (e.key === "Escape") { box.value = ""; query = ""; load(); box.blur(); }
});
// `/` reaches the box from anywhere, the way it does everywhere else.
document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement !== box && document.activeElement !== find && !editing) {
    e.preventDefault();
    box.focus();
  }
});

// Sessions the last boot had running that are not running now. The button
// only exists while there is something to bring back.
let RESTORING = false;
function drawRestore(info) {
  const b = document.getElementById("restore");
  const n = info && info.names ? info.names.length : 0;
  b.hidden = !n;
  if (!n) { RESTORING = false; return; }
  const at = new Date(info.taken_at * 1000);
  const when = at.toLocaleString([], { weekday: "short", hour: "2-digit", minute: "2-digit" });
  b.textContent = RESTORING ? `reopening ${n}…` : `↺ reopen ${n} from ${when}`;
  b.title = info.names.join(", ");
}
document.getElementById("restore").addEventListener("click", async () => {
  if (RESTORING) return;
  RESTORING = true;
  document.getElementById("restore").textContent = "reopening…";
  await fetch("/api/restore", {
    method: "POST",
    headers: { "Content-Type": "application/json", "X-Fleet": "1" },
    body: "{}",
  }).catch(() => { RESTORING = false; });
});

// Conversations this boot had running that have since closed: a tab shut by
// mistake, a worker nobody went back to. One click resumes it in a new
// WezTerm tab, under its old name; × takes one you meant to close off the list.
let CLOSED = [];
const REVIVING = new Map();          // id -> "opening…" or the error it came back with
function drawClosed(list) {
  CLOSED = (list || []).filter(c => REVIVING.get(c.id) !== "gone");
  const b = document.getElementById("closed");
  b.hidden = !CLOSED.length;
  b.textContent = `⟲ closed ${CLOSED.length}`;
  if (!CLOSED.length) document.getElementById("closedlist").hidden = true;
  if (!document.getElementById("closedlist").hidden) paintClosed();
}
function paintClosed() {
  const box = document.getElementById("closedlist");
  box.style.top = document.querySelector("header").getBoundingClientRect().bottom + 6 + "px";
  if (!CLOSED.length) { box.innerHTML = `<div class="none">nothing closed since the machine started</div>`; return; }
  box.innerHTML = CLOSED.map(c => {
    const state = REVIVING.get(c.id);
    const where = c.cwd.startsWith(home) ? "~" + c.cwd.slice(home.length) : c.cwd;
    return `<div class="gone" data-id="${esc(c.id)}">
      <button class="back" title="resume this conversation in a new WezTerm tab">
        <div class="who"><span class="nm">${esc(c.name || c.id.slice(0, 8))}</span>
          <span class="at">${state === "opening" ? "opening…" : "last seen " + hhmm(c.at)}</span></div>
        ${c.title ? `<div class="tt">${esc(c.title)}</div>` : ""}
        <div class="wd">${esc(where)}</div>
        ${state && state !== "opening" ? `<div class="err">${esc(state)}</div>` : ""}
      </button>
      <button class="x" title="closed on purpose: take it off the list">×</button>
    </div>`;
  }).join("");
}
async function closedAction(what, id) {
  const r = await fetch(`/api/${what}`, {
    method: "POST",
    headers: { "Content-Type": "application/json", "X-Fleet": "1" },
    body: JSON.stringify({ id }),
  });
  if (!r.ok) return { ok: false, reason: (await r.text()).match(/<p>Message: (.*?)<\/p>/)?.[1] || `error ${r.status}` };
  return r.json();
}
document.getElementById("closed").addEventListener("click", () => {
  const box = document.getElementById("closedlist");
  found.hidden = true;
  box.hidden = !box.hidden;
  if (!box.hidden) paintClosed();
});
document.getElementById("closedlist").addEventListener("click", async e => {
  const row = e.target.closest(".gone");
  if (!row) return;
  const id = row.dataset.id;
  if (e.target.closest(".x")) {
    REVIVING.set(id, "gone");
    drawClosed(CLOSED);
    await closedAction("dismiss", id).catch(() => {});
    return;
  }
  if (REVIVING.get(id) === "opening") return;
  REVIVING.set(id, "opening");
  paintClosed();
  const done = await closedAction("revive", id).catch(err => ({ ok: false, reason: err.message }));
  // Once it runs again the next poll drops it from the list by itself.
  REVIVING.set(id, done.ok ? "gone" : (done.reason || "could not open it"));
  drawClosed(CLOSED);
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") document.getElementById("closedlist").hidden = true;
});
document.addEventListener("click", e => {
  if (!e.target.closest("#closedlist, #closed")) document.getElementById("closedlist").hidden = true;
});

// Every interactive conversation this machine has had, from any day: the
// filter only sees what runs now, and ⟲ closed only this boot. A search is
// its own request, never part of the poll. A row says which conversation it
// was and why it matched -- and, once it has been summarised, what it was
// about and where it ended; a click opens it, or jumps to it if it runs.
const find = document.getElementById("find");
const found = document.getElementById("found");
let FIND_TIMER = null, FIND_SEQ = 0, FOUND = null;
const REOPENING = new Map();         // id -> "opening…", what came of the click, or the error
function day(iso) {
  if (!iso) return "";
  const d = new Date(iso), now = new Date();
  const time = d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  if (d.toDateString() === now.toDateString()) return `today ${time}`;
  const before = new Date(now); before.setDate(now.getDate() - 1);
  if (d.toDateString() === before.toDateString()) return `yesterday ${time}`;
  return d.toLocaleDateString([], { day: "numeric", month: "short",
    ...(d.getFullYear() !== now.getFullYear() ? { year: "numeric" } : {}) });
}
// The server marks the matched words with \x02 and \x03, so the text can be
// escaped whole before the marks become <mark>.
const marked = s => esc(s).replace(/\x02/g, "<mark>").replace(/\x03/g, "</mark>");
function fitFound() {
  found.style.top = document.querySelector("header").getBoundingClientRect().bottom + 6 + "px";
  // `vh` grows with the page's zoom, so a box of 75vh runs off the bottom of
  // the window and its last rows can never be scrolled into view, let alone
  // clicked. What is left below the header, in the page's own units (the box
  // is border-box, so its padding is inside this).
  const room = innerHeight / ZOOM - parseFloat(found.style.top) - 12;
  found.style.maxHeight = Math.max(0, Math.min(room, innerHeight * 0.75)) + "px";
}
window.addEventListener("resize", () => { if (!found.hidden) fitFound(); });
function paintFound(data) {
  fitFound();
  if (data.error) { found.innerHTML = `<div class="none">search failed: ${esc(data.error)}</div>`; return; }
  if (!data.index) {
    found.innerHTML = `<div class="none">no index yet: agentview-archive.timer builds it within a few minutes</div>`;
    return;
  }
  const rows = data.results.map(h => {
    const p = h.passage || {};
    const where = h.cwd.startsWith(home) ? "~" + h.cwd.slice(home.length) : h.cwd;
    const state = REOPENING.get(h.id), failed = state && !REOPEN_NOTES.includes(state);
    return `<div class="hit" data-id="${esc(h.id)}" role="button" tabindex="0"
        title="${h.live ? "jump to this running conversation" : "resume this conversation in a new WezTerm tab"}">
      <div class="who"><span class="nm">${esc(h.name || h.id.slice(0, 8))}</span>
        ${h.live ? `<span class="bg-tag">running</span>` : ""}
        ${h.via === "meaning" ? `<span class="bg-tag extra" title="no word of yours is in this passage: it means what you asked">by meaning</span>` : ""}
        ${h.project ? `<span class="pj">${esc(h.project)}</span>` : ""}
        <span class="at">${esc(failed || !state ? day(h.active) : state)}</span></div>
      ${h.title ? `<div class="tt">${esc(h.title)}</div>` : ""}
      ${h.summary ? `<div class="sum${h.summary.stale ? " old" : ""}"
          title="${esc(h.summary.about + "\n" + h.summary.ended)}${h.summary.stale ? esc("\n(written before its latest work)") : ""}">
        <div class="abt">${esc(h.summary.about)}</div>
        <div class="end">${esc(h.summary.ended)}</div></div>` : ""}
      ${p.prompt ? `<div class="asked">› ${marked(p.prompt)}</div>` : ""}
      ${p.reply ? `<div class="said">${marked(p.reply)}</div>` : ""}
      <div class="wd">${esc(where)}</div>
      ${failed ? `<div class="err">${esc(state)}</div>` : ""}
    </div>`;
  }).join("");
  const run = data.index.last_run;
  // Meaning search is one half of the answer. When the embedder cannot be
  // reached the rows are the keyword ones alone, and this says so.
  const m = data.meaning || {};
  const off = m.state === "off"
    ? `<div class="off" title="only the words you typed were searched">meaning search is off (${esc(m.why || "no reason given")}): showing matches for your words only</div>` : "";
  const waiting = m.state === "on" && m.pending
    ? ` · ${m.pending} passages not yet searchable by meaning` : "";
  found.innerHTML = off + (rows || `<div class="none">no conversation ${m.state === "on" ? "says or means" : "says"} “${esc(data.query)}”</div>`)
    + `<div class="foot">${data.index.conversations} conversations indexed`
    + `${run ? ` · updated ${esc(day(run.at))}` : ""}${waiting}</div>`;
}
async function runFind() {
  const q = find.value.trim();
  // From three characters, like the filter: fewer matches nearly everything.
  if (q.length < 3) { found.hidden = true; return; }
  const seq = ++FIND_SEQ;
  let data;
  try {
    const r = await fetch(`/api/search?q=${encodeURIComponent(q)}`);
    data = r.ok ? await r.json() : { error: `error ${r.status}` };
  } catch (err) {
    data = { error: "server unreachable" };
  }
  if (seq !== FIND_SEQ) return;          // a newer search is already on its way
  document.getElementById("closedlist").hidden = true;
  found.hidden = false;
  FOUND = data;
  for (const [id, state] of REOPENING) if (state !== "opening…") REOPENING.delete(id);
  paintFound(data);
}
const REOPEN_NOTES = ["opening…", "jumped to it", "opened in a new tab"];
found.addEventListener("click", async e => {
  const row = e.target.closest(".hit");
  // Dragging over a passage to copy it ends in a click; that is not a request.
  if (!row || String(getSelection()) || REOPENING.get(row.dataset.id) === "opening…") return;
  const id = row.dataset.id;
  REOPENING.set(id, "opening…");
  paintFound(FOUND);
  const r = await fetch("/api/reopen", {
